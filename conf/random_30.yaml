defaults:
  - train
  - _self_

mode: fixed

# Seventy sites, as the paper states. The earlier runs of this benchmark used
# sixty, which is the one board that a transpose does not explain, and it has no
# results to keep consistent with.
board:
  row: 10
  col: 7

benchmark:
  id: random-30

training:
  num_envs: 80
  num_minibatches: 2
  num_iterations: 2000

save_frequency: 2000
